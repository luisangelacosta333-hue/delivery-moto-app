window.autocompletarConGPS = function(inputId) {
    if(navigator.vibrate) navigator.vibrate(50);
    if(navigator.geolocation) {
        mostrarToast("📍 Conectando satélite...", "success");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
                const res = await fetch(url, { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } });
                const data = await res.json();
                if(data && data.address) {
                    let calle = data.address.road || data.address.pedestrian || "Dirección desconocida";
                    let num = data.address.house_number || "";
                    document.getElementById(inputId).value = `${calle} ${num}`.trim();
                    mostrarToast("✅ Ubicación encontrada", "success");
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                } else {
                    mostrarToast("No pudimos leer la calle. Escribila a mano.", "error");
                }
            } catch(e) { mostrarToast("Error de conexión GPS.", "error"); }
        }, () => { mostrarToast("Activá el GPS de tu celular", "error"); }, { enableHighAccuracy: true });
    }
};

window.dispararConfetti = function() {
    if(typeof confetti !== 'undefined') {
        if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
        var duration = 3 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff6b00', '#16a34a', '#ffd700'] });
            confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff6b00', '#16a34a', '#ffd700'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
};

window.subirImagenBucket = async function(base64Str, rutaGuardado) {
    try {
        const res = await fetch(base64Str);
        const blob = await res.blob();
        const { error } = await supabaseClient.storage.from('moto_media').upload(rutaGuardado, blob, { upsert: true });
        if (error) throw error;
        return supabaseClient.storage.from('moto_media').getPublicUrl(rutaGuardado).data.publicUrl;
    } catch (e) { return null; }
};

window.comprimirImagen = function(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                let width = img.width; let height = img.height;
                if (width > height) {
                    if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                } else {
                    if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
        };
    });
};

    let widget = document.getElementById('widgetRastreo');
    if(paso === 'comercio' || paso === 'servimoto' || paso === 'login') {
        if(widget) widget.style.display = 'none';
    } else {
        if(widget) widget.style.display = 'flex';
    }

    if(paso === 'feed-global') { resetPagination(); cargarYRenderizarFeed(); }
};

window.cargarYRenderizarFeed = async function(isLoadMore = false) {
    const container = document.getElementById('gridMercadoLibre');
    if(!container || isLoadingMore || (!hasMoreProducts && isLoadMore)) return;
    isLoadingMore = true;

    // APLICAR CLASE DE GRILLA COMPACTA
    container.classList.add('grilla-productos-compacta');

    if (!isLoadMore) {
        container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#16a34a;"><i class="ri-loader-4-line animate-ring"></i> Cargando catálogo...</div>`;
        currentPage = 0; hasMoreProducts = true;
    } else {
        const loaderDiv = document.createElement('div');
        loaderDiv.id = 'bottomLoader';
        loaderDiv.className = 'loader-full-width';
        loaderDiv.style.cssText = "text-align:center; padding:20px; color:#ff6b00; font-weight:bold;";
        loaderDiv.innerHTML = '<i class="ri-loader-4-line animate-ring"></i> Cargando más...';
        container.appendChild(loaderDiv);
    }
    
    const inputProv = document.getElementById('filtroProvincia');
    const inputCiu = document.getElementById('filtroCiudad');
    let provFiltro = inputProv ? quitarAcentos(inputProv.value.trim()) : "";
    let ciuFiltro = inputCiu ? quitarAcentos(inputCiu.value.trim()) : "";

    try {
        if (dbComerciosCache.length === 0) {
            let { data: dbComercios, error: errC } = await supabaseClient.from('moto_comercios').select('*');
            if(errC) throw errC;
            dbComerciosCache = dbComercios || [];
        }

        let comerciosValidos = dbComerciosCache.filter(c => {
            let matchProv = provFiltro === "" || quitarAcentos(c.provincia).includes(provFiltro);
            let matchCiu = ciuFiltro === "" || quitarAcentos(c.ciudad).includes(ciuFiltro);
            let matchCat = categoriaActiva === "" || quitarAcentos(c.categoria).includes(categoriaActiva);
            return matchProv && matchCiu && matchCat;
        });

        const idsValidos = comerciosValidos.map(c => c.id);
        
        if(idsValidos.length === 0 && !comercioFiltradoId) {
            container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#f97316;">No hay locales disponibles con estos filtros.</div>`;
            isLoadingMore = false; hasMoreProducts = false; return;
        }

        let from = currentPage * ITEMS_PER_PAGE;
        let to = from + ITEMS_PER_PAGE - 1;

        let query = supabaseClient.from('moto_productos').select('*').eq('pausado', false);
        if (comercioFiltradoId) query = query.eq('id_comercio', comercioFiltradoId);
        else query = query.in('id_comercio', idsValidos);

        let { data: dbProductos, error: errP } = await query.order('id', { ascending: false }).range(from, to);
        if(errP) throw errP;

        let btnLimpiarFiltro = '';
        if (!isLoadMore) {
            container.innerHTML = '';
            
            if (comercioFiltradoId) {
                let comInfo = dbComerciosCache.find(c => c.id === comercioFiltradoId);
                if(comInfo) {
                    let imgPortada = comInfo.img_portada || 'https://images.unsplash.com/photo-1550547660-d9450f859349';
                    let imgSelfieRaw = comInfo.img_selfie;
                    let imgSelfie = (imgSelfieRaw && imgSelfieRaw !== 'null' && imgSelfieRaw.trim() !== '') ? imgSelfieRaw : "https://cdn-icons-png.flaticon.com/512/3112/3112618.png";
                    
                    btnLimpiarFiltro = `
                    <div class="loader-full-width" style="margin-bottom:15px; border-radius:16px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.08); background:white; position:relative; border:1px solid #e2e8f0; z-index:1;">
                        <div style="height:110px; width:100%; background-image:url('${imgPortada}'); background-size:cover; background-position:center; position:relative;">
                            <div style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8));"></div>
                            <button onclick="limpiarFiltroComercio()" style="position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.2); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.4); border-radius:50%; width:32px; height:32px; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;"><i class="ri-close-line" style="font-size:22px;"></i></button>
                            <div style="position:absolute; bottom:2px; width:100%; height:30px; overflow:hidden; z-index:3; border-bottom: 2px dashed rgba(255,255,255,0.2);">
                                <i class="ri-motorbike-fill" style="position:absolute; color:#f97316; font-size:24px; animation: motoRunBanner 4s linear infinite; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));"></i>
                            </div>
                        </div>
                        
                        <div style="padding:12px 16px 16px 16px; display:flex; gap:14px; position:relative; z-index:2;">
                            <div style="margin-top:-40px;">
                                <img src="${imgSelfie}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3112/3112618.png'" style="width:75px; height:75px; border-radius:50%; border:3px solid white; object-fit:cover; box-shadow:0 0 15px rgba(255,255,255,0.9), 0 4px 10px rgba(0,0,0,0.15); background:white;">
                            </div>
                            <div style="flex:1; padding-top:4px;">
                                <div style="font-weight:900; font-size:17px; color:#0f172a; line-height:1.2; margin-bottom:6px;">${comInfo.nombre}</div>
                                <div style="font-size:12px; color:#64748b; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:4px;"><i class="ri-map-pin-2-fill" style="color:#ef4444; font-size:14px;"></i> ${comInfo.direccion}, ${comInfo.ciudad}</div>
                                <div style="font-size:12px; color:#64748b; font-weight:600; display:flex; align-items:center; gap:4px;"><i class="ri-whatsapp-fill" style="color:#16a34a; font-size:14px;"></i> ${comInfo.celular || 'Sin teléfono'}</div>
                            </div>
                        </div>
                    </div>`;
                }
            }
            
            if(btnLimpiarFiltro) container.innerHTML += btnLimpiarFiltro;
        } else {
            const bottomLoader = document.getElementById('bottomLoader');
            if(bottomLoader) bottomLoader.remove();
        }

        if((!dbProductos || dbProductos.length === 0) && !isLoadMore) {
            let botonVolver = comercioFiltradoId ? `<button onclick="limpiarFiltroComercio()" style="margin-top:15px; padding:10px 20px; background:#f97316; color:white; border:none; border-radius:10px; font-weight:bold;">Volver a todos</button>` : '';
            container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#f97316;">No hay artículos. ${botonVolver}</div>`;
            isLoadingMore = false; hasMoreProducts = false; return;
        }
        
        if (dbProductos && dbProductos.length > 0) {
            let html = '';
            dbProductos.forEach(p => {
                let comercioData = dbComerciosCache.find(c => c.id === p.id_comercio);
                let nomComercio = comercioData ? comercioData.nombre : "Local";
                let dirComercio = comercioData ? (comercioData.direccion + ", " + comercioData.ciudad + ", " + comercioData.provincia) : "";
                let telComercio = comercioData ? comercioData.celular : NUMERO_SOPORTE_CENTRAL; 
                let aliasComercio = (comercioData && comercioData.alias_mp) ? comercioData.alias_mp : ""; 
                let imgSelfieRaw = comercioData ? comercioData.img_selfie : null;
                let urlLogoComercio = (imgSelfieRaw && imgSelfieRaw !== 'null' && imgSelfieRaw.trim() !== '') ? imgSelfieRaw : "https://cdn-icons-png.flaticon.com/512/3112/3112618.png";
                
                let tiempoEstimado = Math.floor(Math.random() * (25 - 10 + 1) + 10);
                
                // TARJETA COMPACTA ADAPTADA A GRILLA 2x2
                html += `
                <div class="card-premium" style="padding:0; border-radius:12px; display:flex; flex-direction:column; background:white; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.04); overflow:hidden; position:relative;">
                    <div style="height:100px; width:100%; position:relative; flex-shrink:0;">
                        <img src="${p.img_producto}" loading="lazy" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;">
                        <div style="position:absolute; bottom:0; left:0; width:100%; height:30px; background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);"></div>
                        <div style="position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.95); padding:2px 6px; border-radius:6px; font-size:9px; font-weight:800; color:#16a34a; box-shadow:0 2px 6px rgba(0,0,0,0.1); z-index:5;"><i class="ri-timer-flash-fill"></i> Aprox ${tiempoEstimado} min</div>
                    </div>
                    <div style="padding:10px; display:flex; flex-direction:column; flex:1; justify-content:space-between; background:white;">
                        <div style="font-family:'Sora',sans-serif; font-weight:800; font-size:12px; line-height:1.2; color:#0f172a; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${p.nombre}</div>
                        
                        <div onclick="filtrarFeedPorComercio('${p.id_comercio}')" style="cursor:pointer; display:flex; align-items:center; gap:4px; margin-bottom:8px; background:#fff7ed; border:1px solid #ffd4b3; padding:2px 6px; border-radius:6px; width:fit-content;">
                            <img src="${urlLogoComercio}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3112/3112618.png'" loading="lazy" style="width:14px; height:14px; border-radius:50%; object-fit:cover; flex-shrink:0;">
                            <span style="font-size:9px; font-weight:800; color:#cc4400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px;">${nomComercio}</span>
                        </div>

                        <div style="color:#16a34a; font-weight:900; font-size:16px; margin-bottom:8px;">$${parseFloat(p.precio).toLocaleString('es-AR')}</div>
                        
                        <button class="btn-primary" style="width:100%; padding:8px; font-size:11px; font-weight:900; border-radius:8px; background:linear-gradient(135deg, #f97316, #ea580c); box-shadow:0 4px 10px rgba(234,88,12,0.3); border:none; color:white; cursor:pointer;" onclick="intentarComprar('${p.id}', '${p.nombre}', ${p.precio}, '${dirComercio}', '${aliasComercio}', '${telComercio}')">
                            AGREGAR <i class="ri-shopping-cart-2-line" style="font-size:13px; vertical-align:middle; margin-left:2px;"></i>
                        </button>
                    </div>
                </div>`;
            });
            
            container.insertAdjacentHTML('beforeend', html);
            if (!isLoadMore) { baseProductosActivos = dbProductos; } 
            else { baseProductosActivos = baseProductosActivos.concat(dbProductos); }

            if (dbProductos.length < ITEMS_PER_PAGE) { hasMoreProducts = false; } 
            else { currentPage++; }
        } else { hasMoreProducts = false; }
    } catch (e) {
        if(!isLoadMore) { container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#f97316;">Error al conectar con la base de datos.</div>`; }
    } finally { isLoadingMore = false; }
};

window.iniciarLogin = function(tipo) {
    tipoLoginActual = tipo; 
    let tituloLogin = "Acceso a Cuenta";
    let descLogin = "Ingresá al panel";
    if(tipo === 'comercio') { tituloLogin = '<i class="ri-store-2-fill"></i> Acceso Comercio'; }
    if(tipo === 'cadete') { tituloLogin = '<i class="ri-motorbike-fill"></i> Acceso Cadete'; }
    if(tipo === 'cliente') { tituloLogin = '<i class="ri-shopping-bag-3-fill"></i> Registro Comprador'; }
    
    document.getElementById('lblTipoLogin').innerHTML = tituloLogin;
    document.getElementById('descLogin').textContent = descLogin;
    document.getElementById('loginCelular').value = '';
    document.getElementById('loginClave').value = '';
    irPaso('login');
};

window.validarLogin = async function() {
    const cel = document.getElementById('loginCelular').value.trim();
    const pwd = document.getElementById('loginClave').value.trim();
    
    if(cel.length < 8) return mostrarToast('Ingresá un celular válido', 'error');
    if(pwd.length < 4) return mostrarToast('La clave debe tener al menos 4 caracteres', 'error');
    mostrarToast('⏳ Conectando...', 'success');
    
    const emailFalso = `${cel}@deliverymoto.com`;
    try {
        let { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailFalso, password: pwd });
        if (error && error.message.includes('Invalid login')) {
            const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email: emailFalso, password: pwd });
            if (signUpError) throw signUpError;
            data = signUpData;
        } else if (error) { throw error; }

        sessionActual = data?.user || data; 
        AppStore.set('cliente_celular', cel); 
        localStorage.setItem('ultimo_login_tipo', tipoLoginActual); 

        mostrarToast('✅ Acceso Autorizado', 'success');
        
        setTimeout(async () => {
            if(tipoLoginActual === 'comercio') {
                miComercioLogueadoId = sessionActual.id;
                irPaso('comercio');
                await cargarDatosComercioExistente(miComercioLogueadoId); 
                window.renderizarAdminComercio(); 
                window.renderizarBandejaPedidos(); 
            } else if(tipoLoginActual === 'cadete') {
                let { data: cadDB } = await supabaseClient.from('moto_cadetes').select('*').eq('id', sessionActual.id).single();
                if(cadDB) {
                    viajesMotoCount = cadDB.viajes_realizados || 0;
                    deudaMotoAcumulada = cadDB.deuda_acumulada || 0;
                    if(document.getElementById('viajesMotoBadge')) document.getElementById('viajesMotoBadge').textContent = viajesMotoCount + ' Viajes Confirmados';
                    if(document.getElementById('deudaMoto')) document.getElementById('deudaMoto').textContent = '$' + deudaMotoAcumulada.toLocaleString('es-AR');
                    irPaso('servimoto'); 
                } else { irPaso('servimoto-onboarding'); }
            } else if(tipoLoginActual === 'cliente') {
                let { data: cliDB } = await supabaseClient.from('moto_clientes').select('*').eq('id', sessionActual.id).single();
                if(cliDB) {
                    AppStore.set('cliente_dir', cliDB.direccion);
                    AppStore.set('cliente_ciu', cliDB.ciudad);
                    AppStore.set('cliente_prov', cliDB.provincia);
                    AppStore.set('cliente_nombre', sessionActual.user_metadata?.full_name || ''); 
                    if(productoPendienteAdd) procesarAgregadoCarrito();
                    irPaso('feed-global');
                } else { irPaso('cliente-ubicacion'); }
            }
        }, 50);
    } catch(e) { mostrarToast('Error al conectar la cuenta. Reintentá.', 'error'); }
};

async function cargarDatosComercioExistente(id) {
    try {
        const { data, error } = await supabaseClient.from('moto_comercios').select('*').eq('id', id).single();
        if (data) {
            if(document.getElementById('comercioNombre')) document.getElementById('comercioNombre').value = data.nombre || '';
            if(document.getElementById('comercioDireccionExacta')) document.getElementById('comercioDireccionExacta').value = data.direccion || '';
            if(document.getElementById('comercioProvincia')) document.getElementById('comercioProvincia').value = data.provincia || '';
            if(document.getElementById('comercioCiudad')) document.getElementById('comercioCiudad').value = data.ciudad || '';
            if(document.getElementById('comercioAbre')) document.getElementById('comercioAbre').value = data.hora_abre || '';
            if(document.getElementById('comercioCierra')) document.getElementById('comercioCierra').value = data.hora_cierra || '';
            if(document.getElementById('comercioAlias')) document.getElementById('comercioAlias').value = data.alias_mp || '';
            
            if(data.img_selfie && document.getElementById('boxSelfieComercioModal')) {
                document.getElementById('boxSelfieComercioModal').style.backgroundImage = `url(${data.img_selfie})`;
                if(document.getElementById('iconSelfieComercioContenedor')) document.getElementById('iconSelfieComercioContenedor').style.display = 'none';
                if(document.getElementById('lblTextSelfieComercio')) document.getElementById('lblTextSelfieComercio').innerHTML = '<span style="color:#15803d;">✅ Selfie Recuperada</span>';
                AppStore.set('selfie_com_tmp', data.img_selfie);
            }
            if(data.img_portada && document.getElementById('boxPortadaComercio')) {
                document.getElementById('boxPortadaComercio').style.backgroundImage = `url(${data.img_portada})`;
                if(document.getElementById('iconPortadaContenedor')) document.getElementById('iconPortadaContenedor').style.display = 'none';
                if(document.getElementById('lblPortadaComercio')) document.getElementById('lblPortadaComercio').textContent = '✅ Portada Recuperada';
                AppStore.set('portada_com_tmp', data.img_portada);
            }
        }
    } catch(e) {}
}

window.guardarPerfilCliente = async function() {
    const nom = document.getElementById('inputNombreCliente') ? document.getElementById('inputNombreCliente').value.trim() : "";
    const prov = document.getElementById('selProvinciaCliente') ? document.getElementById('selProvinciaCliente').value : "";
    const ciu = document.getElementById('inputCiudadCliente') ? document.getElementById('inputCiudadCliente').value.trim() : "";
    const dir = document.getElementById('inputDireccionCliente') ? document.getElementById('inputDireccionCliente').value.trim() : "";
    
    let cel = AppStore.get('cliente_celular');
    if (!cel && sessionActual && sessionActual.email) { cel = sessionActual.email.split('@')[0]; }
    if (!cel) cel = "00000000";

    const b64Selfie = AppStore.get('selfie_cliente_tmp');

    if(!nom || !prov || !ciu || !dir) return mostrarToast('Completá tu Nombre, Provincia, Ciudad y Dirección', 'error');
    if(!b64Selfie) return mostrarToast('La foto Selfie es obligatoria', 'error');
    
    mostrarToast('⏳ Guardando perfil seguro...', 'success');
    
    AppStore.set('cliente_nombre', nom);
    AppStore.set('cliente_prov', prov);
    AppStore.set('cliente_ciu', ciu);
    AppStore.set('cliente_dir', dir);
    AppStore.set('cliente_celular', cel);

    try {
        let urlFoto = b64Selfie;
        if(b64Selfie.startsWith('data:image')) {
            urlFoto = await subirImagenBucket(b64Selfie, `clientes/${sessionActual.id}_selfie.jpg`);
        }
        await supabaseClient.auth.updateUser({ data: { full_name: nom } });
        await supabaseClient.from('moto_clientes').upsert({
            id: sessionActual.id, celular: cel, provincia: prov, ciudad: ciu,
            direccion: dir, img_selfie: urlFoto || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
        });
    } catch(e) { console.warn('Falla de BD menor, continuamos', e); }
    
    mostrarToast('✅ Perfil guardado con éxito.', 'success');
    if(productoPendienteAdd) procesarAgregadoCarrito();
    irPaso('feed-global');
};

window.agregarPedidoBandejaComercio = function(total, destino, nombreCliente, carritoJSON) {
    let horaExacta = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    let detalleHTML = carritoJSON && carritoJSON.length > 0 ? carritoJSON.map(item => `▪️ ${item.nombre}`).join('<br>') : "Detalle no disponible";
    pedidosComercio.unshift({ total: total, destino: destino, cliente: nombreCliente || "Cliente sin registrar", hora: horaExacta, detalle: detalleHTML, id: Date.now() });
    
    if(navigator.vibrate) navigator.vibrate([500, 250, 500]);
    if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance("Tin. Ingresó un nuevo pedido al panel del comercio.");
        msg.lang = 'es-AR'; msg.rate = 1.1; window.speechSynthesis.speak(msg);
    }
    window.renderizarBandejaPedidos();
};

window.procesarLiquidacionIA = async function(input) {
    var fileInput = input || document.getElementById('file-comprobante');
    if(!fileInput || !fileInput.files || fileInput.files.length === 0) {
        mostrarToast("Por favor adjuntá el comprobante primero.", "error");
        return;
    }
    
    var file = fileInput.files[0];
    mostrarToast("⏳ Subiendo comprobante al servidor...", "success");

    try {
        if(!sessionActual || !sessionActual.id) throw new Error("Debes iniciar sesión");
        const userId = sessionActual.id;

        const fileName = `pagos/pago_${userId}_${Date.now()}.jpg`;
        await supabaseClient.storage.from('moto_media').upload(fileName, file);
        const compUrl = supabaseClient.storage.from('moto_media').getPublicUrl(fileName).data.publicUrl;

        mostrarToast("🤖 IA Analizando transferencia...", "success");

        const deudaActual = deudaMotoAcumulada; 
        if (deudaActual <= 0) throw new Error("No tenés deuda pendiente para pagar.");

        const aiReq = await fetch('/api/pago', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                comprobante_url: compUrl,
                monto_esperado: deudaActual
            })
        });

        const aiRes = await aiReq.json();

        if(aiRes.pago_valido) {
            await supabaseClient.from('moto_cadetes').update({ 
                viajes_realizados: 0, 
                deuda_acumulada: 0 
            }).eq('id', userId);

            viajesMotoCount = 0;
            deudaMotoAcumulada = 0;

            let elemDeuda = document.getElementById('deudaMoto');
            if(elemDeuda){
                elemDeuda.style.color = '#16a34a'; 
                elemDeuda.textContent = '$0';
            }
            
            let elemViajes = document.getElementById('viajesMotoBadge');
            if(elemViajes) elemViajes.innerHTML = '<i class="ri-check-double-line"></i> IA: Cuenta al día';

            let listaViajes = document.getElementById('listaViajesCadete'); 
            if(listaViajes) listaViajes.innerHTML = ''; 

            mostrarToast("✅ Pago validado por IA. Deuda en cero.", "success");
            if(input) input.value = ''; 
        } else {
            throw new Error(aiRes.motivo || "Comprobante rechazado por la IA");
        }

    } catch (error) {
        mostrarToast("Pago Rechazado: " + error.message, "error");
        if(input) input.value = '';
    }
};

    telefonoComercioCalculo = telefonoComercio || NUMERO_SOPORTE_CENTRAL;
    productoPendienteAdd = { id: idProducto, nombre: nombre, precio: parseFloat(precio), direccion: direccionComercio, alias: aliasComercio };
    if(!sessionActual) { mostrarToast('¡Iniciá sesión para armar tu pedido!', 'error'); iniciarLogin('cliente'); return; }
    if(!AppStore.get('cliente_dir')) { mostrarToast('Falta configurar tu dirección de entrega', 'error'); irPaso('cliente-ubicacion'); return; }
    window.procesarAgregadoCarrito();
};

window.procesarAgregadoCarrito = function() {
    if(!productoPendienteAdd) return;
    carritoGlobal.push({ nombre: productoPendienteAdd.nombre, precio: productoPendienteAdd.precio, cantidad: 1 });
    localStorage.setItem('moto_carrito_guardado', JSON.stringify(carritoGlobal)); 
    direccionOrigenCalculo = productoPendienteAdd.direccion; aliasOrigenCalculo = productoPendienteAdd.alias;
    mostrarToast(`✅ Agregaste: ${productoPendienteAdd.nombre}`, 'success');
    const floatBtn = document.getElementById('btnFloatingCart'); const badge = document.getElementById('badgeCarrito');
    if(floatBtn) floatBtn.style.display = 'flex';
    if(badge) { badge.textContent = carritoGlobal.length; badge.style.transform = 'scale(1.3)'; setTimeout(() => { badge.style.transform = 'scale(1)'; }, 200); }
    productoPendienteAdd = null; 
};

function initMapaMago() {
    if (!mapaMagoObj) {
        mapaMagoObj = L.map('mapaCanvas', { zoomControl: false, attributionControl: false }).setView([-26.8083, -65.2176], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaMagoObj);
    }
}

async function geocodificarDireccionMago(direccion) {
    try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}&limit=1&countrycodes=ar`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } });
        const datos = await res.json();
        if (datos && datos.length > 0) return { lat: parseFloat(datos[0].lat), lng: parseFloat(datos[0].lon), nombre: datos[0].display_name };
        return null;
    } catch (e) { return null; }
}

async function calcularRutaOSRMMago(origen, destino) {
    try {
        const url = `https://router.project-osrm.org/route/v1/driving/${origen.lng},${origen.lat};${destino.lng},${destino.lat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const datos = await res.json();
        if (datos.code === 'Ok' && datos.routes && datos.routes.length > 0) {
            const ruta = datos.routes[0];
            return { distancia: ruta.distance, duracion: ruta.duration, coordenadas: ruta.geometry.coordinates.map(c => [c[1], c[0]]) };
        }
        return null;
    } catch (e) { return null; }
}

function calcularDistanciaHaversine(lat1, lng1, lat2, lng2) {
    const R = 6371000; const dLat = (lat2 - lat1) * Math.PI / 180; const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;
}

window.abrirMapaMago = function() {
    cerrarCarrito();
    const modalMapa = document.getElementById('modalMapaGrande');
    if(!modalMapa) return;
    modalMapa.classList.add('show');
    
    const fallbackText = document.getElementById('mapFallbackText');
    if(fallbackText) fallbackText.style.display = 'none';

    setTimeout(async () => {
        const box = document.getElementById('mapaBox');
        if(box) { box.style.opacity = '1'; box.style.transform = 'scale(1)'; }
        
        initMapaMago();
        setTimeout(() => { if(mapaMagoObj) mapaMagoObj.invalidateSize(); }, 300);

        let strOrigen = ""; let strDestino = "";
        if (esViajeEspecial) {
            let dO = document.getElementById('dirOrigenEspecial') ? document.getElementById('dirOrigenEspecial').value.trim() : "";
            let pD = document.getElementById('selProvinciaEspecial') ? document.getElementById('selProvinciaEspecial').value.trim() : "Tucumán";
            let cD = document.getElementById('ciuDestinoEspecial') ? document.getElementById('ciuDestinoEspecial').value.trim() : "Famaillá";
            strOrigen = `${dO}, ${cD}, ${pD}, Argentina`; 
            let dD = document.getElementById('dirDestinoEspecial') ? document.getElementById('dirDestinoEspecial').value.trim() : "";
            strDestino = `${dD}, ${cD}, ${pD}, Argentina`;
        } else {
            let pC = AppStore.get('cliente_prov') || 'Tucumán';
            let cC = AppStore.get('cliente_ciu') || 'Famaillá';
            let dC = AppStore.get('cliente_dir');
            strDestino = `${dC}, ${cC}, ${pC}, Argentina`;
            let dL = direccionOrigenCalculo ? direccionOrigenCalculo : "Plaza Principal";
            strOrigen = `${dL}, ${cC}, ${pC}, Argentina`;
        }

        try {
            const origen = await geocodificarDireccionMago(strOrigen);
            const destino = await geocodificarDireccionMago(strDestino);
            
            if(!origen || !destino) { window.calcularMatematicaEnvio("1.0"); return; }

            if(magoLayerGroup) { magoLayerGroup.clearLayers(); } else { magoLayerGroup = L.featureGroup().addTo(mapaMagoObj); }
            if (animacionIntervalMago) clearInterval(animacionIntervalMago);

            const icoOri = L.divIcon({ className: 'custom-marker', html: '<div class="custom-marker-origen"><i class="ri-store-fill"></i></div>', iconSize: [32, 32], iconAnchor: [16, 32] });
            const icoDes = L.divIcon({ className: 'custom-marker', html: '<div class="custom-marker-destino"><i class="ri-home-4-fill"></i></div>', iconSize: [32, 32], iconAnchor: [16, 32] });

            L.marker([origen.lat, origen.lng], { icon: icoOri }).addTo(magoLayerGroup).bindPopup('<strong style="color:#16a34a;">ORIGEN</strong><br>' + (origen.nombre ? origen.nombre.substring(0, 80) : strOrigen));
            L.marker([destino.lat, destino.lng], { icon: icoDes }).addTo(magoLayerGroup).bindPopup('<strong style="color:#ea580c;">DESTINO</strong><br>' + (destino.nombre ? destino.nombre.substring(0, 80) : strDestino));

            const ruta = await calcularRutaOSRMMago(origen, destino);
            let distMeters = 1000;

            if (ruta) {
                capaRutaMago = L.polyline(ruta.coordenadas, { color: '#ea580c', weight: 6, opacity: 0.85, dashArray: '12, 8', className: 'ruta-animada' }).addTo(magoLayerGroup);
                mapaMagoObj.fitBounds(magoLayerGroup.getBounds(), { padding: [60, 60] });
                distMeters = ruta.distancia;
            } else {
                capaRutaMago = L.polyline([[origen.lat, origen.lng], [destino.lat, destino.lng]], { color: '#ea580c', weight: 5, dashArray: '10, 10' }).addTo(magoLayerGroup);
                mapaMagoObj.fitBounds(magoLayerGroup.getBounds(), { padding: [60, 60] });
                distMeters = calcularDistanciaHaversine(origen.lat, origen.lng, destino.lat, destino.lng);
            }

            window.calcularMatematicaEnvio(distMeters);

        } catch(e) { window.calcularMatematicaEnvio("1.0"); }
    }, 400); 
};

window.calcularMatematicaEnvio = function(distancia) {
    let metrosReales = 0;
    if (typeof distancia === 'string' && distancia.includes('.')) { metrosReales = parseFloat(distancia) * 1000; } 
    else { metrosReales = parseInt(distancia); }

    let cuadrasTotales = Math.round(metrosReales / 100);
    const horaActual = new Date().getHours();
    const esNoche = (horaActual >= 20 || horaActual < 6);
    
    const tarifaBase = esNoche ? 3000 : 2000; 
    
    if(document.getElementById('lblTarifaBase')) document.getElementById('lblTarifaBase').textContent = esNoche ? 'Costo Envío Noche' : 'Costo Envío Día';
    
    let costoExtra = 0;
    if(cuadrasTotales > 10) { costoExtra = (cuadrasTotales - 10) * 100; }
    
    costoEnvioCalculado = tarifaBase + costoExtra;
    let kmFormato = (metrosReales / 1000).toFixed(2);
    
    if(document.getElementById('mapaKm')) document.getElementById('mapaKm').textContent = `${kmFormato} km (${cuadrasTotales} cuadras)`;
    if(document.getElementById('mapaCosto')) document.getElementById('mapaCosto').textContent = '$' + costoEnvioCalculado.toLocaleString('es-AR');
    
    let celCliente = AppStore.get('cliente_celular') || "Sin teléfono";
    let pInfo = document.querySelector("#modalMapaGrande p");
    
    // NUEVO TEXTO DE PRE-COORDINACIÓN EN MAPA
    if(pInfo) pInfo.innerHTML = `💡 <b>Importante:</b> Al solicitar el viaje, buscaremos un ServiMoto en el radar. <b>Deberán pre-coordinar los detalles por WhatsApp</b> antes de confirmar el viaje.<br><span style="font-weight:600; color:#0f172a; margin-top:4px; display:inline-block;">(Tu celular para este viaje: ${celCliente})</span>`;
    
    // CAMBIO DE BOTÓN CONFIRMAR A "PRE-COORDINAR"
    let btnConfirmarMapa = document.querySelector('#modalMapaGrande button[onclick="procesarEnvioMapa()"]');
    if(btnConfirmarMapa) {
        btnConfirmarMapa.innerHTML = '<i class="ri-whatsapp-fill" style="font-size:16px; vertical-align:middle; margin-right:4px;"></i> PRE-COORDINAR VIAJE';
        btnConfirmarMapa.style.background = '#25D366';
        btnConfirmarMapa.style.boxShadow = '0 4px 10px rgba(37,211,102,0.3)';
    }
    
    let subtotalProductos = 0;
    carritoGlobal.forEach(i => { subtotalProductos += i.precio; });
    if(document.getElementById('mapaTotalProductos')) document.getElementById('mapaTotalProductos').textContent = '$' + subtotalProductos.toLocaleString('es-AR');
    
    const fallbackText = document.getElementById('mapFallbackText');
    if(fallbackText) fallbackText.style.display = 'none';
};

// ==========================================
// 10. MAPA DEMO INTERACTIVO DE LA LANDING
// ==========================================
(function() {
    let mapaDemo = null;
    let marcadorOrigen = null;
    let marcadorDestino = null;
    let capaRuta = null;

    function initMapaDemo() {
        if (mapaDemo) return;
        mapaDemo = L.map('mapaDemo', { zoomControl: true, attributionControl: true }).setView([-26.8083, -65.2176], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(mapaDemo);
        setTimeout(function() { if (mapaDemo) mapaDemo.invalidateSize(); }, 200);
    }

    async function geocodificarDireccionDemo(direccion) {
        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}&limit=1&countrycodes=ar`;
            const respuesta = await fetch(url, { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } });
            const datos = await respuesta.json();
            if (datos && datos.length > 0) return { lat: parseFloat(datos[0].lat), lng: parseFloat(datos[0].lon), nombre: datos[0].display_name };
            return null;
        } catch (e) { return null; }
    }

    async function calcularRutaOSRMDemo(origen, destino) {
        try {
            const url = `https://router.project-osrm.org/route/v1/driving/${origen.lng},${origen.lat};${destino.lng},${destino.lat}?overview=full&geometries=geojson&steps=true`;
            const respuesta = await fetch(url);
            const datos = await respuesta.json();
            if (datos.code === 'Ok' && datos.routes && datos.routes.length > 0) {
                const ruta = datos.routes[0];
                return { distancia: ruta.distance, duracion: ruta.duration, coordenadas: ruta.geometry.coordinates.map(function(c) { return [c[1], c[0]]; }), pasos: ruta.legs[0].steps };
            }
            return null;
        } catch (e) { return null; }
    }

    window.calcularRutaDemo = async function() {
        const inputOrigen = document.getElementById('demoOrigen');
        const inputDestino = document.getElementById('demoDestino');
        const infoBox = document.getElementById('mapaDemoInfo');
        
        if (!inputOrigen.value.trim() || !inputDestino.value.trim()) { window.mostrarToast('Ingresa ambas direcciones', 'error'); return; }
        infoBox.innerHTML = '<i class="ri-loader-4-line animate-ring" style="color:#ff6b00;"></i> Buscando direcciones...';
        infoBox.style.borderColor = '#ff6b00';

        const origen = await geocodificarDireccionDemo(inputOrigen.value.trim());
        if (!origen) { infoBox.innerHTML = '<i class="ri-error-warning-fill" style="color:#ef4444;"></i> No se encontro el ORIGEN.'; infoBox.style.borderColor = '#ef4444'; return; }
        infoBox.innerHTML = '<i class="ri-loader-4-line animate-ring" style="color:#ff6b00;"></i> Buscando destino...';
        const destino = await geocodificarDireccionDemo(inputDestino.value.trim());
        if (!destino) { infoBox.innerHTML = '<i class="ri-error-warning-fill" style="color:#ef4444;"></i> No se encontro el DESTINO.'; infoBox.style.borderColor = '#ef4444'; return; }
        infoBox.innerHTML = '<i class="ri-loader-4-line animate-ring" style="color:#ff6b00;"></i> Calculando ruta...';

        if (marcadorOrigen) mapaDemo.removeLayer(marcadorOrigen);
        if (marcadorDestino) mapaDemo.removeLayer(marcadorDestino);
        if (capaRuta) mapaDemo.removeLayer(capaRuta);

        const iconoOrigen = L.divIcon({ className: 'custom-marker', html: '<div class="custom-marker-origen"><i class="ri-store-fill"></i></div>', iconSize: [32, 32], iconAnchor: [16, 32] });
        const iconoDestino = L.divIcon({ className: 'custom-marker', html: '<div class="custom-marker-destino"><i class="ri-home-4-fill"></i></div>', iconSize: [32, 32], iconAnchor: [16, 32] });

        marcadorOrigen = L.marker([origen.lat, origen.lng], { icon: iconoOrigen }).addTo(mapaDemo).bindPopup('<strong style="color:#16a34a;">ORIGEN</strong><br>' + origen.nombre.substring(0, 80));
        marcadorDestino = L.marker([destino.lat, destino.lng], { icon: iconoDestino }).addTo(mapaDemo).bindPopup('<strong style="color:#ea580c;">DESTINO</strong><br>' + destino.nombre.substring(0, 80));

        const ruta = await calcularRutaOSRMDemo(origen, destino);
        if (ruta) {
            capaRuta = L.polyline(ruta.coordenadas, { color: '#ea580c', weight: 6, opacity: 0.85, dashArray: '12, 8', className: 'ruta-animada' }).addTo(mapaDemo);
            mapaDemo.fitBounds(L.latLngBounds(ruta.coordenadas), { padding: [60, 60] });
            const distanciaKm = (ruta.distancia / 1000).toFixed(2);
            const duracionMin = Math.round(ruta.duracion / 60);
            const cuadras = Math.round(ruta.distancia / 100);
            const hora = new Date().getHours();
            const esNoche = (hora >= 20 || hora < 6);
            
            const tarifaBase = esNoche ? 3000 : 2000;
            
            let costoExtra = 0; if (cuadras > 10) costoExtra = (cuadras - 10) * 100;
            const costoTotal = tarifaBase + costoExtra;

            document.getElementById('demoDistancia').textContent = distanciaKm + ' km';
            document.getElementById('demoTiempo').textContent = duracionMin + ' min';
            document.getElementById('demoCosto').textContent = '$' + costoTotal.toLocaleString('es-AR');
            document.getElementById('demoResultados').style.display = 'grid';

            infoBox.innerHTML = '<i class="ri-checkbox-circle-fill" style="color:#16a34a;"></i> Ruta calculada: ' + distanciaKm + ' km • ~' + duracionMin + ' min';
            infoBox.style.borderColor = '#16a34a';
        } else {
            capaRuta = L.polyline([[origen.lat, origen.lng], [destino.lat, destino.lng]], { color: '#ea580c', weight: 5, dashArray: '10, 10' }).addTo(mapaDemo);
            mapaDemo.fitBounds(L.latLngBounds([[origen.lat, origen.lng], [destino.lat, destino.lng]]), { padding: [60, 60] });
            const R = 6371000; const dLat = (destino.lat - origen.lat) * Math.PI / 180; const dLng = (destino.lng - origen.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(origen.lat * Math.PI / 180) * Math.cos(destino.lat * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
            const distMetros = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            const distanciaKm = (distMetros / 1000).toFixed(2);
            const duracionMin = Math.round((distMetros / 1000) / 0.025); 
            const cuadras = Math.round(distMetros / 100);
            const hora = new Date().getHours();
            const esNoche = (hora >= 20 || hora < 6);
            
            const tarifaBase = esNoche ? 3000 : 2000;
            
            let costoExtra = 0; if (cuadras > 10) costoExtra = (cuadras - 10) * 100;
            const costoTotal = tarifaBase + costoExtra;

            document.getElementById('demoDistancia').textContent = distanciaKm + ' km (aprox)';
            document.getElementById('demoTiempo').textContent = '~' + duracionMin + ' min';
            document.getElementById('demoCosto').textContent = '$' + costoTotal.toLocaleString('es-AR');
            document.getElementById('demoResultados').style.display = 'grid';

            infoBox.innerHTML = '<i class="ri-information-fill" style="color:#f59e0b;"></i> Ruta aproximada (linea recta): ' + distanciaKm + ' km';
            infoBox.style.borderColor = '#f59e0b';
        }
    };

    window.centrarMapaDemo = function() {
        if (mapaDemo) {
            mapaDemo.setView([-26.8083, -65.2176], 13);
            setTimeout(function() { mapaDemo.invalidateSize(); }, 100);
        }
    };

    window.iniciarDemoRapida = function() {
        window.cerrarModalMarketplace();
        setTimeout(function() {
            const seccion = document.querySelector('#mapaDemoContainer').closest('section');
            if (seccion) seccion.scrollIntoView({ behavior: 'smooth' });
            setTimeout(function() { if (mapaDemo) mapaDemo.invalidateSize(); window.calcularRutaDemo(); }, 600);
        }, 300);
    };

    function init() {
        initMapaDemo();
        setTimeout(function() { window.calcularRutaDemo(); }, 800);
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting && mapaDemo) {
                        setTimeout(function() { mapaDemo.invalidateSize(); }, 100);
                    }
                });
            }, { threshold: 0.1 });
            observer.observe(document.getElementById('mapaDemoContainer'));
        }
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
    window.addEventListener('resize', function() { if (mapaDemo) mapaDemo.invalidateSize(); });
})();
</script>

            <button onclick="window.open('https://wa.me/${telLimpio}?text=Hola, soy ${miNombre} de ServiMoto. Acepté tu pedido, pasame los detalles por favor.', '_blank')" style="background:#25D366; color:white; border:none; padding:12px; border-radius:8px; font-weight:900; font-size:13px; width:100%; margin-bottom:10px; box-shadow:0 4px 10px rgba(37,211,102,0.3); cursor:pointer;">

window.autocompletarConGPS = function(inputId) {
    if(navigator.vibrate) navigator.vibrate(50);
    if(navigator.geolocation) {
        mostrarToast("📍 Conectando satélite...", "success");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
                const res = await fetch(url, { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } });
                const data = await res.json();
                if(data && data.address) {
                    let calle = data.address.road || data.address.pedestrian || "Dirección desconocida";
                    let num = data.address.house_number || "";
                    document.getElementById(inputId).value = `${calle} ${num}`.trim();
                    mostrarToast("✅ Ubicación encontrada", "success");
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                } else {
                    mostrarToast("No pudimos leer la calle. Escribila a mano.", "error");
                }
            } catch(e) { mostrarToast("Error de conexión GPS.", "error"); }
        }, () => { mostrarToast("Activá el GPS de tu celular", "error"); }, { enableHighAccuracy: true });
    }
};

window.dispararConfetti = function() {
    if(typeof confetti !== 'undefined') {
        if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
        var duration = 3 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff6b00', '#16a34a', '#ffd700'] });
            confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff6b00', '#16a34a', '#ffd700'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
};

window.comprimirImagen = function(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                let width = img.width; let height = img.height;
                if (width > height) {
                    if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                } else {
                    if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
        };
    });
};

window.cargarYRenderizarFeed = async function(isLoadMore = false) {
    const container = document.getElementById('gridMercadoLibre');
    if(!container || isLoadingMore || (!hasMoreProducts && isLoadMore)) return;
    isLoadingMore = true;

    // APLICAR CLASE DE GRILLA COMPACTA
    container.classList.add('grilla-productos-compacta');

    if (!isLoadMore) {
        container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#16a34a;"><i class="ri-loader-4-line animate-ring"></i> Cargando catálogo...</div>`;
        currentPage = 0; hasMoreProducts = true;
    } else {
        const loaderDiv = document.createElement('div');
        loaderDiv.id = 'bottomLoader';
        loaderDiv.className = 'loader-full-width';
        loaderDiv.style.cssText = "text-align:center; padding:20px; color:#ff6b00; font-weight:bold;";
        loaderDiv.innerHTML = '<i class="ri-loader-4-line animate-ring"></i> Cargando más...';
        container.appendChild(loaderDiv);
    }
    
    const inputProv = document.getElementById('filtroProvincia');
    const inputCiu = document.getElementById('filtroCiudad');
    let provFiltro = inputProv ? quitarAcentos(inputProv.value.trim()) : "";
    let ciuFiltro = inputCiu ? quitarAcentos(inputCiu.value.trim()) : "";

    try {
        if (dbComerciosCache.length === 0) {
            let { data: dbComercios, error: errC } = await supabaseClient.from('moto_comercios').select('*');
            if(errC) throw errC;
            dbComerciosCache = dbComercios || [];
        }

        let comerciosValidos = dbComerciosCache.filter(c => {
            let matchProv = provFiltro === "" || quitarAcentos(c.provincia).includes(provFiltro);
            let matchCiu = ciuFiltro === "" || quitarAcentos(c.ciudad).includes(ciuFiltro);
            let matchCat = categoriaActiva === "" || quitarAcentos(c.categoria).includes(categoriaActiva);
            return matchProv && matchCiu && matchCat;
        });

        const idsValidos = comerciosValidos.map(c => c.id);
        
        if(idsValidos.length === 0 && !comercioFiltradoId) {
            container.innerHTML = `<div class="loader-full-width" style="text-align:center; padding:30px; font-weight:800; color:#f97316;">No hay locales disponibles con estos filtros.</div>`;
            isLoadingMore = false; hasMoreProducts = false; return;
        }

        let from = currentPage * ITEMS_PER_PAGE;
        let to = from + ITEMS_PER_PAGE - 1;

        let query = supabaseClient.from('moto_productos').select('*').eq('pausado', false);
        if (comercioFiltradoId) query = query.eq('id_comercio', comercioFiltradoId);
        else query = query.in('id_comercio', idsValidos);

        let { data: dbProductos, error: errP } = await query.order('id', { ascending: false }).range(from, to);
        if(errP) throw errP;

        let btnLimpiarFiltro = '';
        if (!isLoadMore) {
            container.innerHTML = '';
            
            if (comercioFiltradoId) {
                let comInfo = dbComerciosCache.find(c => c.id === comercioFiltradoId);
                if(comInfo) {
                    let imgPortada = comInfo.img_portada || 'https://images.unsplash.com/photo-1550547660-d9450f859349';
                    let imgSelfieRaw = comInfo.img_selfie;
                    let imgSelfie = (imgSelfieRaw && imgSelfieRaw !== 'null' && imgSelfieRaw.trim() !== '') ? imgSelfieRaw : "https://cdn-icons-png.flaticon.com/512/3112/3112618.png";
                    
                    btnLimpiarFiltro = `
                    <div class="loader-full-width" style="margin-bottom:15px; border-radius:16px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.08); background:white; position:relative; border:1px solid #e2e8f0; z-index:1;">

window.iniciarLogin = function(tipo) {
    tipoLoginActual = tipo; 
    let tituloLogin = "Acceso a Cuenta";
    let descLogin = "Ingresá al panel";
    if(tipo === 'comercio') { tituloLogin = '<i class="ri-store-2-fill"></i> Acceso Comercio'; }
    if(tipo === 'cadete') { tituloLogin = '<i class="ri-motorbike-fill"></i> Acceso Cadete'; }
    if(tipo === 'cliente') { tituloLogin = '<i class="ri-shopping-bag-3-fill"></i> Registro Comprador'; }
    
    document.getElementById('lblTipoLogin').innerHTML = tituloLogin;
    document.getElementById('descLogin').textContent = descLogin;
    document.getElementById('loginCelular').value = '';
    document.getElementById('loginClave').value = '';
    irPaso('login');
};

window.validarLogin = async function() {
    const cel = document.getElementById('loginCelular').value.trim();
    const pwd = document.getElementById('loginClave').value.trim();
    
    if(cel.length < 8) return mostrarToast('Ingresá un celular válido', 'error');
    if(pwd.length < 4) return mostrarToast('La clave debe tener al menos 4 caracteres', 'error');
    mostrarToast('⏳ Conectando...', 'success');
    
    const emailFalso = `${cel}@deliverymoto.com`;
    try {
        let { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailFalso, password: pwd });
        if (error && error.message.includes('Invalid login')) {
            const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email: emailFalso, password: pwd });
            if (signUpError) throw signUpError;
            data = signUpData;
        } else if (error) { throw error; }

        sessionActual = data?.user || data; 
        AppStore.set('cliente_celular', cel); 
        localStorage.setItem('ultimo_login_tipo', tipoLoginActual); 

        mostrarToast('✅ Acceso Autorizado', 'success');
        
        setTimeout(async () => {
            if(tipoLoginActual === 'comercio') {
                miComercioLogueadoId = sessionActual.id;
                irPaso('comercio');
                await cargarDatosComercioExistente(miComercioLogueadoId); 
                window.renderizarAdminComercio(); 
                window.renderizarBandejaPedidos(); 
            } else if(tipoLoginActual === 'cadete') {
                let { data: cadDB } = await supabaseClient.from('moto_cadetes').select('*').eq('id', sessionActual.id).single();
                if(cadDB) {
                    viajesMotoCount = cadDB.viajes_realizados || 0;
                    deudaMotoAcumulada = cadDB.deuda_acumulada || 0;
                    if(document.getElementById('viajesMotoBadge')) document.getElementById('viajesMotoBadge').textContent = viajesMotoCount + ' Viajes Confirmados';
                    if(document.getElementById('deudaMoto')) document.getElementById('deudaMoto').textContent = '$' + deudaMotoAcumulada.toLocaleString('es-AR');
                    irPaso('servimoto'); 
                } else { irPaso('servimoto-onboarding'); }
            } else if(tipoLoginActual === 'cliente') {
                let { data: cliDB } = await supabaseClient.from('moto_clientes').select('*').eq('id', sessionActual.id).single();
                if(cliDB) {
                    AppStore.set('cliente_dir', cliDB.direccion);
                    AppStore.set('cliente_ciu', cliDB.ciudad);
                    AppStore.set('cliente_prov', cliDB.provincia);
                    AppStore.set('cliente_nombre', sessionActual.user_metadata?.full_name || ''); 
                    if(productoPendienteAdd) procesarAgregadoCarrito();
                    irPaso('feed-global');
                } else { irPaso('cliente-ubicacion'); }
            }
        }, 50);
    } catch(e) { mostrarToast('Error al conectar la cuenta. Reintentá.', 'error'); }
};

async function cargarDatosComercioExistente(id) {
    try {
        const { data, error } = await supabaseClient.from('moto_comercios').select('*').eq('id', id).single();
        if (data) {
            if(document.getElementById('comercioNombre')) document.getElementById('comercioNombre').value = data.nombre || '';
            if(document.getElementById('comercioDireccionExacta')) document.getElementById('comercioDireccionExacta').value = data.direccion || '';
            if(document.getElementById('comercioProvincia')) document.getElementById('comercioProvincia').value = data.provincia || '';
            if(document.getElementById('comercioCiudad')) document.getElementById('comercioCiudad').value = data.ciudad || '';
            if(document.getElementById('comercioAbre')) document.getElementById('comercioAbre').value = data.hora_abre || '';
            if(document.getElementById('comercioCierra')) document.getElementById('comercioCierra').value = data.hora_cierra || '';
            if(document.getElementById('comercioAlias')) document.getElementById('comercioAlias').value = data.alias_mp || '';
            
            if(data.img_selfie && document.getElementById('boxSelfieComercioModal')) {
                document.getElementById('boxSelfieComercioModal').style.backgroundImage = `url(${data.img_selfie})`;
                if(document.getElementById('iconSelfieComercioContenedor')) document.getElementById('iconSelfieComercioContenedor').style.display = 'none';
                if(document.getElementById('lblTextSelfieComercio')) document.getElementById('lblTextSelfieComercio').innerHTML = '<span style="color:#15803d;">✅ Selfie Recuperada</span>';
                AppStore.set('selfie_com_tmp', data.img_selfie);
            }
            if(data.img_portada && document.getElementById('boxPortadaComercio')) {
                document.getElementById('boxPortadaComercio').style.backgroundImage = `url(${data.img_portada})`;
                if(document.getElementById('iconPortadaContenedor')) document.getElementById('iconPortadaContenedor').style.display = 'none';
                if(document.getElementById('lblPortadaComercio')) document.getElementById('lblPortadaComercio').textContent = '✅ Portada Recuperada';
                AppStore.set('portada_com_tmp', data.img_portada);
            }
        }
    } catch(e) {}
}

window.guardarPerfilCliente = async function() {
    const nom = document.getElementById('inputNombreCliente') ? document.getElementById('inputNombreCliente').value.trim() : "";
    const prov = document.getElementById('selProvinciaCliente') ? document.getElementById('selProvinciaCliente').value : "";
    const ciu = document.getElementById('inputCiudadCliente') ? document.getElementById('inputCiudadCliente').value.trim() : "";
    const dir = document.getElementById('inputDireccionCliente') ? document.getElementById('inputDireccionCliente').value.trim() : "";
    
    let cel = AppStore.get('cliente_celular');
    if (!cel && sessionActual && sessionActual.email) { cel = sessionActual.email.split('@')[0]; }
    if (!cel) cel = "00000000";

    const b64Selfie = AppStore.get('selfie_cliente_tmp');

    if(!nom || !prov || !ciu || !dir) return mostrarToast('Completá tu Nombre, Provincia, Ciudad y Dirección', 'error');
    if(!b64Selfie) return mostrarToast('La foto Selfie es obligatoria', 'error');
    
    mostrarToast('⏳ Guardando perfil seguro...', 'success');
    
    AppStore.set('cliente_nombre', nom);
    AppStore.set('cliente_prov', prov);
    AppStore.set('cliente_ciu', ciu);
    AppStore.set('cliente_dir', dir);
    AppStore.set('cliente_celular', cel);

    try {
        let urlFoto = b64Selfie;
        if(b64Selfie.startsWith('data:image')) {
            urlFoto = await subirImagenBucket(b64Selfie, `clientes/${sessionActual.id}_selfie.jpg`);
        }
        await supabaseClient.auth.updateUser({ data: { full_name: nom } });
        await supabaseClient.from('moto_clientes').upsert({
            id: sessionActual.id, celular: cel, provincia: prov, ciudad: ciu,
            direccion: dir, img_selfie: urlFoto || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
        });
    } catch(e) { console.warn('Falla de BD menor, continuamos', e); }
    
    mostrarToast('✅ Perfil guardado con éxito.', 'success');
    if(productoPendienteAdd) procesarAgregadoCarrito();
    irPaso('feed-global');
};

window.agregarPedidoBandejaComercio = function(total, destino, nombreCliente, carritoJSON) {
    let horaExacta = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    let detalleHTML = carritoJSON && carritoJSON.length > 0 ? carritoJSON.map(item => `▪️ ${item.nombre}`).join('<br>') : "Detalle no disponible";
    pedidosComercio.unshift({ total: total, destino: destino, cliente: nombreCliente || "Cliente sin registrar", hora: horaExacta, detalle: detalleHTML, id: Date.now() });
    
    if(navigator.vibrate) navigator.vibrate([500, 250, 500]);
    if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance("Tin. Ingresó un nuevo pedido al panel del comercio.");
        msg.lang = 'es-AR'; msg.rate = 1.1; window.speechSynthesis.speak(msg);
    }
    window.renderizarBandejaPedidos();
};

            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                <div style="width: 100%;">
                    <div style="color:#15803d; font-weight:800; font-size:16px; display:flex; justify-content:space-between;">
                        <span>🛒 Pedido</span> 
                        <span style="font-size:12px; color:#166534; background:#bbf7d0; padding:2px 6px; border-radius:4px;">${p.hora}</span>
                    </div>
                    <div style="background:white; border-radius:8px; padding:8px; margin-top:8px; border:1px solid #bbf7d0;">

                <button onclick="eliminarPedidoComercio(${idx})" style="background:#f97316; color:white; border:none; border-radius:8px; padding:12px; font-size:16px; font-weight:800; cursor:pointer;"><i class="ri-delete-bin-fill"></i></button>

window.eliminarPedidoComercio = function(idx) {
    pedidosComercio.splice(idx, 1);
    mostrarToast('Notificación archivada', 'success');
    window.renderizarBandejaPedidos();
};

window.llamarMotoDesdeLocal = async function(idx) {
    mostrarToast("📡 Emitiendo señal al radar de cadetes...", "success");
    const btnCall = document.getElementById(`btnLlamarMoto_${idx}`);
    if(btnCall) { btnCall.innerHTML = '<i class="ri-radar-line animate-ring"></i> BUSCANDO PARA COORDINAR...'; btnCall.style.background = '#f59e0b'; }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance("Atención base, buscando un ServiMoto cercano para un nuevo envío.");
        msg.lang = 'es-AR'; msg.rate = 1.1; window.speechSynthesis.speak(msg);
    }

    let pedidoInfo = pedidosComercio[idx];
    let nombreLocal = document.getElementById('comercioNombre') ? document.getElementById('comercioNombre').value.trim() : "Comercio Local";
    let dirLocal = document.getElementById('comercioDireccionExacta') ? document.getElementById('comercioDireccionExacta').value.trim() : "Local";
    let viaje_id = pedidoInfo.id || Date.now();
    let telCliente = AppStore.get('cliente_celular_real') || AppStore.get('cliente_celular') || "00000000";
    
    AppStore.set('my_last_trip_id', viaje_id);

    canalRadar.send({
        type: 'broadcast',
        event: 'nuevo_viaje',
        payload: { 
            viaje_id: viaje_id, 
            local: `${nombreLocal} (${dirLocal})`, 
            destino: pedidoInfo.destino,
            costo: pedidoInfo.total,
            tel_cliente: telCliente
        }
    });

    setTimeout(() => { 
        mostrarToast("✅ ¡Alerta enviada a motos cercanas!", "success"); 
        if(btnCall) { btnCall.innerHTML = '<i class="ri-check-double-line"></i> SEÑAL ENVIADA'; btnCall.style.background = '#16a34a'; }
    }, 3000);
};

window.pedirFavorCadeteWhatsApp = function(evt) {
    let btn = (evt && evt.currentTarget) ? evt.currentTarget : (window.event ? window.event.currentTarget : null);
    if (!btn) { 
        document.querySelectorAll('button').forEach(b => {
            if(b.innerText.includes('PEDIR ENCARGO')) btn = b;
        });
    }
    
    let htmlOriginal = btn ? btn.innerHTML : "";
    let bgOriginal = btn ? btn.style.background : "";
    let borderOriginal = btn ? btn.style.border : "";
    let colorOriginal = btn ? btn.style.color : "";

    if (btn) {
        btn.innerHTML = '<i class="ri-radar-line animate-ring"></i> BUSCANDO PARA COORDINAR...';
        btn.style.background = '#16a34a'; 
        btn.style.color = 'white';
        btn.style.border = '2px solid #16a34a';
        btn.style.pointerEvents = 'none'; 
        window.btnFavorRef = { el: btn, html: htmlOriginal, bg: bgOriginal, border: borderOriginal, color: colorOriginal };
    }

    if(navigator.vibrate) navigator.vibrate(50);
    mostrarToast("📡 Emitiendo señal al radar de cadetes...", "success");

    let nomLocal = document.getElementById('comercioNombre') ? document.getElementById('comercioNombre').value.trim() : "Un comercio";
    let dirLocal = document.getElementById('comercioDireccionExacta') ? document.getElementById('comercioDireccionExacta').value.trim() : "Local";
    let telCliente = AppStore.get('cliente_celular_real') || AppStore.get('cliente_celular') || "00000000";
    let viaje_id = Date.now();
    
    AppStore.set('my_last_trip_id', viaje_id);

    canalRadar.send({
        type: 'broadcast',
        event: 'nuevo_viaje',
        payload: { 
            viaje_id: viaje_id, 
            local: dirLocal ? `${nomLocal} (${dirLocal})` : nomLocal,
            destino: "Encargo / Favor",
            costo: "A conv.",
            tel_cliente: telCliente
        }
    });

    // Timeout aumentado a 90 segundos

window.guardarComercio = async function() {
    const nom = document.getElementById('comercioNombre').value.trim();
    const dir = document.getElementById('comercioDireccionExacta').value.trim();
    const prov = document.getElementById('comercioProvincia').value.trim();

    const hCierra = document.getElementById('comercioCierra') ? document.getElementById('comercioCierra').value : "";
    const cat = document.getElementById('comercioCategoria') ? document.getElementById('comercioCategoria').value : "Varios";
    const aliasMP = document.getElementById('comercioAlias') ? document.getElementById('comercioAlias').value.trim() : "";
    const cel = AppStore.get('cliente_celular') || "00000000";
    
    if(!nom || !dir || !prov || !ciu || !hAbre || !hCierra) return mostrarToast('Completá todos los datos', 'error');
    
    let urlSelfie = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c";
    let urlPortada = "https://images.unsplash.com/photo-1550547660-d9450f859349";

    mostrarToast('⏳ Guardando local seguro...', 'success');

    try {
        miComercioLogueadoId = sessionActual.id;
        if(AppStore.get('selfie_com_tmp') && AppStore.get('selfie_com_tmp').startsWith('data:image')) {
            urlSelfie = await subirImagenBucket(AppStore.get('selfie_com_tmp'), `comercios/${sessionActual.id}_selfie.jpg`);
        } else if (AppStore.get('selfie_com_tmp')) { urlSelfie = AppStore.get('selfie_com_tmp'); }

        if(AppStore.get('portada_com_tmp') && AppStore.get('portada_com_tmp').startsWith('data:image')) {
            urlPortada = await subirImagenBucket(AppStore.get('portada_com_tmp'), `comercios/${sessionActual.id}_portada.jpg`);
        } else if (AppStore.get('portada_com_tmp')) { urlPortada = AppStore.get('portada_com_tmp'); }

        const { error } = await supabaseClient.from('moto_comercios').upsert({
            id: sessionActual.id, celular: cel, nombre: nom, categoria: cat, provincia: prov,
            ciudad: ciu, direccion: dir, hora_abre: hAbre, hora_cierra: hCierra,
            img_portada: urlPortada, img_selfie: urlSelfie, alias_mp: aliasMP

window.agregarArticuloComercio = async function() {

    const pre = parseInt(document.getElementById('newArtPrecio').value);
    const ref = document.getElementById('newArtRef') ? document.getElementById('newArtRef').value.trim() : "";
    
    if(!nom || isNaN(pre)) return mostrarToast('Completá nombre y precio', 'error');
    if(!tempImgBase64) return mostrarToast('Subí una foto del artículo', 'error');
    
    mostrarToast('⏳ Subiendo plato a la red...', 'success');

    try {
        const ext = Date.now();
        const urlArt = await subirImagenBucket(tempImgBase64, `productos/${miComercioLogueadoId}_art_${ext}.jpg`);
        const { error } = await supabaseClient.from('moto_productos').insert({

window.renderizarAdminComercio = async function() {

        const { data: misProductos, error } = await supabaseClient.from('moto_productos').select('*').eq('id_comercio', miComercioLogueadoId);

                    <div><div style="font-size:13.5px; font-weight:800; color:#0f172a;">${p.nombre}</div><div style="font-size:12px; color:#16a34a; font-weight:800;">$${parseFloat(p.precio).toLocaleString('es-AR')}</div></div>

function initMapaMago() {

async function geocodificarDireccionMago(direccion) {
    try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}&limit=1&countrycodes=ar`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } });
        const datos = await res.json();
        if (datos && datos.length > 0) return { lat: parseFloat(datos[0].lat), lng: parseFloat(datos[0].lon), nombre: datos[0].display_name };
        return null;
    } catch (e) { return null; }
}

async function calcularRutaOSRMMago(origen, destino) {
    try {
        const url = `https://router.project-osrm.org/route/v1/driving/${origen.lng},${origen.lat};${destino.lng},${destino.lat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const datos = await res.json();
        if (datos.code === 'Ok' && datos.routes && datos.routes.length > 0) {
            const ruta = datos.routes[0];
            return { distancia: ruta.distance, duracion: ruta.duration, coordenadas: ruta.geometry.coordinates.map(c => [c[1], c[0]]) };
        }
        return null;
    } catch (e) { return null; }
}

function calcularDistanciaHaversine(lat1, lng1, lat2, lng2) {
    const R = 6371000; const dLat = (lat2 - lat1) * Math.PI / 180; const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;
}

                mapaMagoObj.fitBounds(magoLayerGroup.getBounds(), { padding: [60, 60] });
                distMeters = calcularDistanciaHaversine(origen.lat, origen.lng, destino.lat, destino.lng);
            }

window.calcularMatematicaEnvio = function(distancia) {
    let metrosReales = 0;
    if (typeof distancia === 'string' && distancia.includes('.')) { metrosReales = parseFloat(distancia) * 1000; } 
    else { metrosReales = parseInt(distancia); }

    let cuadrasTotales = Math.round(metrosReales / 100);
    const horaActual = new Date().getHours();
    const esNoche = (horaActual >= 20 || horaActual < 6);
    
    const tarifaBase = esNoche ? 3000 : 2000; 
    
    if(document.getElementById('lblTarifaBase')) document.getElementById('lblTarifaBase').textContent = esNoche ? 'Costo Envío Noche' : 'Costo Envío Día';
    
    let costoExtra = 0;
    if(cuadrasTotales > 10) { costoExtra = (cuadrasTotales - 10) * 100; }
    
    costoEnvioCalculado = tarifaBase + costoExtra;
    let kmFormato = (metrosReales / 1000).toFixed(2);
    
    if(document.getElementById('mapaKm')) document.getElementById('mapaKm').textContent = `${kmFormato} km (${cuadrasTotales} cuadras)`;
    if(document.getElementById('mapaCosto')) document.getElementById('mapaCosto').textContent = '$' + costoEnvioCalculado.toLocaleString('es-AR');
    
    let celCliente = AppStore.get('cliente_celular') || "Sin teléfono";
    let pInfo = document.querySelector("#modalMapaGrande p");
    
    // NUEVO TEXTO DE PRE-COORDINACIÓN EN MAPA
    if(pInfo) pInfo.innerHTML = `💡 <b>Importante:</b> Al solicitar el viaje, buscaremos un ServiMoto en el radar. <b>Deberán pre-coordinar los detalles por WhatsApp</b> antes de confirmar el viaje.<br><span style="font-weight:600; color:#0f172a; margin-top:4px; display:inline-block;">(Tu celular para este viaje: ${celCliente})</span>`;
    
    // CAMBIO DE BOTÓN CONFIRMAR A "PRE-COORDINAR"
    let btnConfirmarMapa = document.querySelector('#modalMapaGrande button[onclick="procesarEnvioMapa()"]');
    if(btnConfirmarMapa) {
        btnConfirmarMapa.innerHTML = '<i class="ri-whatsapp-fill" style="font-size:16px; vertical-align:middle; margin-right:4px;"></i> PRE-COORDINAR VIAJE';
        btnConfirmarMapa.style.background = '#25D366';
        btnConfirmarMapa.style.boxShadow = '0 4px 10px rgba(37,211,102,0.3)';
    }
    
    let subtotalProductos = 0;
    carritoGlobal.forEach(i => { subtotalProductos += i.precio; });
    if(document.getElementById('mapaTotalProductos')) document.getElementById('mapaTotalProductos').textContent = '$' + subtotalProductos.toLocaleString('es-AR');
    
    const fallbackText = document.getElementById('mapFallbackText');
    if(fallbackText) fallbackText.style.display = 'none';
};

window.mandarPedidoSoporte = async function() {
